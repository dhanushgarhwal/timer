<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<title>Timer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@500;600&display=swap');

:root{
  --bg:#07080b;
  --text:#f5f6f8;
  --muted:#777d87;
  --glass:rgba(22,24,29,.76);
  --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  display:grid;place-items:center;overflow:hidden;
  padding:clamp(10px,3vw,32px);
  background:
    radial-gradient(70vw 50vw at 50% -10%,#202735 0%,transparent 62%),
    radial-gradient(50vw 45vw at 0 100%,#111722 0%,transparent 70%),
    radial-gradient(45vw 40vw at 100% 100%,#17131e 0%,transparent 70%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
             linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle,#000 15%,transparent 85%);
}
.app{
  width:min(460px,100%);
  padding:clamp(18px,5vw,30px);
  border:1px solid var(--line);
  border-radius:clamp(20px,5vw,30px);
  background:
    linear-gradient(135deg,rgba(255,255,255,.075),transparent 28%),
    linear-gradient(180deg,rgba(255,255,255,.025),rgba(0,0,0,.08)),
    var(--glass);
  backdrop-filter:blur(32px) saturate(140%);
  -webkit-backdrop-filter:blur(32px) saturate(140%);
  box-shadow:
    0 35px 90px rgba(0,0,0,.68),
    0 10px 28px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 -1px 0 rgba(0,0,0,.5);
}
.timer-shell{
  padding:clamp(25px,7vw,36px) 8px;
  border:1px solid rgba(255,255,255,.065);
  border-radius:clamp(17px,4vw,23px);
  background:
    radial-gradient(80% 100% at 50% 0%,rgba(255,255,255,.055),transparent 68%),
    rgba(0,0,0,.12);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.055),
    inset 0 -15px 25px rgba(0,0,0,.13),
    0 14px 30px rgba(0,0,0,.18);
}
.timer{
  text-align:center;
  font-family:"DM Mono","SFMono-Regular",Consolas,monospace;
  font-size:clamp(50px,17vw,78px);
  line-height:1;
  font-weight:500;
  letter-spacing:clamp(-4px,-1vw,-5px);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  text-shadow:0 3px 22px rgba(0,0,0,.5),0 0 30px rgba(150,180,235,.07);
}
.adjust{
  display:flex;justify-content:center;gap:9px;
  margin:clamp(15px,4vw,20px) 0;
}
button{
  appearance:none;border:0;outline:0;
  font:600 11px/1 Inter,system-ui,sans-serif;
  cursor:pointer;color:#dfe4ec;
  -webkit-tap-highlight-color:transparent;
}
.small{
  width:clamp(42px,11vw,46px);
  height:clamp(34px,9vw,38px);
  border-radius:11px;
  border:1px solid rgba(255,255,255,.075);
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  box-shadow:0 6px 13px rgba(0,0,0,.34),
             inset 0 1px 0 rgba(255,255,255,.09),
             inset 0 -1px 0 rgba(0,0,0,.4);
  font-size:20px;
  transition:.14s ease;
}
.small:hover{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));transform:translateY(-1px)}
.small:active{transform:translateY(2px) scale(.97)}
.actions{display:grid;grid-template-columns:1fr clamp(82px,23vw,105px);gap:10px}
.start,.reset{
  height:clamp(47px,12vw,53px);
  border-radius:14px;
  letter-spacing:1.3px;
  transition:.14s ease;
}
.start{
  color:#090b0f;
  background:linear-gradient(145deg,#fff 0%,#e2e7ef 48%,#b9c3d2 100%);
  border:1px solid rgba(255,255,255,.65);
  box-shadow:0 12px 23px rgba(0,0,0,.4),
             inset 0 1px 0 #fff,
             inset 0 -2px 4px rgba(73,84,103,.24);
}
.start:hover{filter:brightness(1.06);transform:translateY(-1px)}
.start:active{transform:translateY(2px);box-shadow:0 5px 10px rgba(0,0,0,.4),inset 0 2px 5px rgba(55,65,82,.22)}
.reset{
  color:#9da5b2;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  box-shadow:0 9px 18px rgba(0,0,0,.3),
             inset 0 1px 0 rgba(255,255,255,.075),
             inset 0 -1px 0 rgba(0,0,0,.4);
}
.reset:hover{color:#eef2f8;transform:translateY(-1px)}
.reset:active{transform:translateY(2px)}
@media(max-height:420px){
  .app{padding:14px;max-width:430px}
  .timer-shell{padding:18px 8px}
  .adjust{margin:10px 0}
  .start,.reset{height:43px}
}
@media(max-width:280px){
  .app{padding:12px;border-radius:18px}
  .timer{font-size:43px;letter-spacing:-3px}
  .actions{gap:7px}
}
</style>
<link rel="icon" type="image/svg+xml" href="timer-favicon.svg">
</head>
<body>
<main class="app">
  <section class="timer-shell">
    <div class="timer" id="timer">25:00</div>
  </section>

  <div class="adjust">
    <button class="small" id="minusBtn" aria-label="Decrease one minute">−</button>
    <button class="small" id="plusBtn" aria-label="Increase one minute">+</button>
  </div>

  <div class="actions">
    <button class="start" id="startBtn">START</button>
    <button class="reset" id="resetBtn">RESET</button>
  </div>
</main>



<script>
(() => {
  "use strict";

  const timerDisplay = document.getElementById("timer");
  const startBtn = document.getElementById("startBtn");
  const resetBtn = document.getElementById("resetBtn");
  const minusBtn = document.getElementById("minusBtn");
  const plusBtn = document.getElementById("plusBtn");

  if (!timerDisplay || !startBtn || !resetBtn || !minusBtn || !plusBtn) return;

  const DEFAULT_SECONDS = 25 * 60;
  let remainingSeconds = DEFAULT_SECONDS;
  let running = false;
  let endAt = 0;
  let ticker = null;
  let audioContext = null;
  let alarmRinging = false;
  let alarmTimer = null;

  function render() {
    const s = Math.max(0, Math.ceil(remainingSeconds));
    timerDisplay.textContent =
      String(Math.floor(s / 60)).padStart(2, "0") + ":" +
      String(s % 60).padStart(2, "0");
    startBtn.textContent = running ? "PAUSE" : "START";
  }

  function audio() {
    if (!audioContext) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      audioContext = new C();
    }
    if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
    return audioContext;
  }

  function chime() {
    const ctx = audio();
    if (!ctx) return;
    const now = ctx.currentTime;
    [[659.25,0,.22],[783.99,.12,.24],[1046.5,.25,.42]].forEach(([f,delay,len]) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      const t = now + delay;
      o.type = "sine";
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.12, t + .018);
      g.gain.exponentialRampToValueAtTime(.0001, t + len);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t);
      o.stop(t + len + .02);
    });
  }

  function stopAlarm() {
    alarmRinging = false;
    if (alarmTimer !== null) {
      clearTimeout(alarmTimer);
      alarmTimer = null;
    }
  }

  function startAlarm() {
    stopAlarm();
    alarmRinging = true;
    const ring = () => {
      if (!alarmRinging) return;
      chime();
      alarmTimer = setTimeout(ring, 2400);
    };
    ring();
  }

  function stopTicker() {
    if (ticker !== null) {
      clearTimeout(ticker);
      ticker = null;
    }
  }

  function sync() {
    if (!running) return;
    const left = Math.max(0, (endAt - Date.now()) / 1000);
    if (left <= 0) {
      remainingSeconds = 0;
      running = false;
      stopTicker();
      render();
      startAlarm();
      return;
    }
    remainingSeconds = left;
    render();
    ticker = setTimeout(sync, 200);
  }

  function start() {
    stopAlarm();
    if (remainingSeconds <= 0) remainingSeconds = DEFAULT_SECONDS;
    endAt = Date.now() + remainingSeconds * 1000;
    running = true;
    stopTicker();
    sync();
  }

  function pause() {
    if (!running) return;
    remainingSeconds = Math.max(0, (endAt - Date.now()) / 1000);
    running = false;
    stopTicker();
    render();
  }

  function toggle() {
    if (alarmRinging) {
      stopAlarm();
      return;
    }
    running ? pause() : start();
  }

  function reset() {
    stopAlarm();
    running = false;
    stopTicker();
    remainingSeconds = DEFAULT_SECONDS;
    render();
  }

  function adjust(delta) {
    stopAlarm();
    if (running) {
      endAt += delta * 60000;
      remainingSeconds = Math.max(0, (endAt - Date.now()) / 1000);
      if (remainingSeconds <= 0) {
        remainingSeconds = 0;
        running = false;
        stopTicker();
        render();
        startAlarm();
        return;
      }
    } else {
      remainingSeconds = Math.max(0, remainingSeconds + delta * 60);
    }
    render();
  }

  startBtn.addEventListener("click", toggle);
  resetBtn.addEventListener("click", reset);
  minusBtn.addEventListener("click", () => adjust(-1));
  plusBtn.addEventListener("click", () => adjust(1));

  document.addEventListener("keydown", e => {
    if (e.code === "Space") {
      e.preventDefault();
      toggle();
    } else if (e.key.toLowerCase() === "r") {
      e.preventDefault();
      reset();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      adjust(1);
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      adjust(-1);
    } else if (e.key === "Escape") {
      e.preventDefault();
      stopAlarm();
      if (running) pause();
    }
  });

  document.addEventListener("wheel", e => {
    if (e.deltaY) adjust(e.deltaY < 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && running) sync();
  });

  window.addEventListener("focus", () => {
    if (running) sync();
  });

  render();
})();
</script>
</body>
</html>
