<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252b36"/>
      <stop offset=".48" stop-color="#11151c"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="shine" x1="12" y1="8" x2="51" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".035"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="letter" x1="20" y1="15" x2="45" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#e3e8f1"/>
      <stop offset="1" stop-color="#9da9ba"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity=".65"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- No circle: rounded glass tile -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="#05070a"
        stroke="#ffffff" stroke-opacity=".10"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="url(#bg)"
        stroke="#ffffff" stroke-opacity=".055"/>

  <!-- Glass highlight -->
  <path d="M18 5H47C54 5 59 10 59 17V28C47 21 35 15 18 5Z"
        fill="url(#shine)"/>

  <!-- T glow -->
  <path d="M17 17H47V24H36.4V48H27.6V24H17Z"
        fill="#9fbfff" opacity=".16" filter="url(#glow)"/>

  <!-- T -->
  <path d="M17 16H47V23.5H36.35V48H27.65V23.5H17Z"
        fill="url(#letter)" filter="url(#shadow)"/>

  <!-- Subtle lower reflection -->
  <path d="M13 52C24 56 40 57 51 51" fill="none"
        stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
</svg>